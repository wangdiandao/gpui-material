name: Engineering CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows MSVC
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify toolchain and runner
        run: |
          Get-CimInstance Win32_OperatingSystem | Format-List Caption,Version,BuildNumber
          $rust = rustc -vV
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $rust
          if ($rust -notcontains 'host: x86_64-pc-windows-msvc') {
            throw 'Expected x64 MSVC Rust'
          }

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check phase, documents and dependency graphs
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          $base = if ($env:PR_BASE) { $env:PR_BASE } else { $env:PUSH_BEFORE }
          if ($base -and $base -notmatch '^0+$') {
            git diff --check $base HEAD
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cargo xtask check $base
          } else {
            cargo xtask check
          }

      - name: Check default workspace
        run: cargo check --locked

      - name: Check Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace and Gallery UI tests
        run: cargo test --locked --workspace --all-features

      - name: Build native Gallery
        run: cargo build --locked -p gpui-material-gallery --timings

      - name: Upload Windows engineering build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gallery-windows-x64-msvc
          if-no-files-found: error
          path: |
            target/debug/gpui-material-gallery.exe
            target/cargo-timings/cargo-timing.html
            LICENSE
            THIRD_PARTY_NOTICES.md
