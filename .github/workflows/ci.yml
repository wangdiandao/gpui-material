name: Engineering CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Whitespace checks compare the entire PR or push against its base.
          fetch-depth: 0
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check diff whitespace
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=${PR_BASE:-$PUSH_BEFORE}
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            git diff --check "$base" HEAD
          fi

      - name: Check documents, generated tokens and dependency graphs
        run: cargo xtask check

      - name: Check default workspace
        run: cargo check --locked

  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify native Rust toolchain
        env:
          RUST_HOST: ${{ matrix.target }}
        run: |
          rust=$(rustc -vV)
          printf '%s\n' "$rust"
          grep -Fx "host: $RUST_HOST" <<< "$rust"

      - name: Install Linux platform dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace and Gallery UI tests
        run: cargo test --locked --workspace --all-features

      - name: Build native Gallery
        run: cargo build --locked -p gpui-material-gallery

  required:
    name: CI required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [checks, native]
    if: ${{ always() }}
    env:
      REPOSITORY_CHECKS: ${{ needs.checks.result }}
      NATIVE_CHECKS: ${{ needs.native.result }}
    steps:
      - name: Require repository and native checks to pass
        run: |
          printf 'Repository checks: %s\nNative matrix: %s\n' "$REPOSITORY_CHECKS" "$NATIVE_CHECKS"
          [[ "$REPOSITORY_CHECKS" == success && "$NATIVE_CHECKS" == success ]]
