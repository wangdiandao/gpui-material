name: Engineering CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
      website: ${{ steps.scope.outputs.website }}
      checks: ${{ steps.scope.outputs.checks }}
      release_scripts: ${{ steps.scope.outputs.release_scripts }}
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select checks and check diff whitespace
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/ci-scope.sh "${PR_BASE:-$PUSH_BEFORE}"

  repo-checks:
    name: Repository checks
    needs: scope
    if: needs.scope.outputs.docs == 'true' || needs.scope.outputs.checks == 'true' || needs.scope.outputs.release_scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux platform dependencies
        if: needs.scope.outputs.checks == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.scope.outputs.docs == 'true' || needs.scope.outputs.checks == 'true'
        with:
          key: repo-checks-ubuntu-24.04
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check Markdown links and bilingual pairs
        if: needs.scope.outputs.docs == 'true'
        run: cargo xtask docs --check

      - name: Check formatting
        if: needs.scope.outputs.checks == 'true'
        run: cargo fmt --all --check

      - name: Check generated tokens and dependency graphs
        if: needs.scope.outputs.checks == 'true'
        run: |
          cargo xtask tokens --check
          cargo xtask graph

      - name: Check default workspace, default-feature Gallery, and slim feature slices
        if: needs.scope.outputs.checks == 'true'
        run: |
          cargo check --locked
          cargo check --locked -p gpui-material-gallery
          cargo check --locked -p gpui-material --no-default-features
          cargo check --locked -p gpui-material --no-default-features --features display
          cargo check --locked -p gpui-material --no-default-features --features actions,inputs
          cargo check --locked -p gpui-material --no-default-features --features carousel
          cargo check --locked -p gpui-material --no-default-features --features window-chrome
          cargo check --locked -p gpui-material-components --no-default-features

      - name: Validate release scripts
        if: needs.scope.outputs.release_scripts == 'true'
        run: |
          python3 -m py_compile .github/scripts/release.py .github/scripts/test_release.py
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  website:
    name: Website
    needs: scope
    # Pushes use the Pages workflow, which builds once for deployment.
    if: needs.scope.outputs.website == 'true' && github.event_name != 'push'
    uses: ./.github/workflows/website-build.yml
    permissions:
      contents: read
      pages: read

  native:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify native Rust toolchain
        env:
          RUST_HOST: ${{ matrix.target }}
        run: |
          rust=$(rustc -vV)
          printf '%s\n' "$rust"
          grep -Fx "host: $RUST_HOST" <<< "$rust"

      - name: Install Linux platform dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold pkg-config libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev \
            libvulkan1 mesa-vulkan-drivers
          echo "RUSTFLAGS=-C linker=clang -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check Rustdoc
        if: matrix.name == 'Linux x64'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --all-features

      - name: Run workspace and Gallery UI tests
        run: cargo test --locked --workspace --all-features --lib --tests

      - name: Run doc tests
        if: matrix.name == 'Linux x64'
        run: cargo test --locked --workspace --all-features --doc

      - name: Run offscreen UI rendering tests
        run: cargo test --locked -p gpui-material-gallery --all-features --test rendering

      - name: Build native Gallery
        run: cargo build --locked -p gpui-material-gallery --all-features

  required:
    name: CI required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [scope, repo-checks, website, native]
    if: ${{ always() }}
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      REPO_CHECKS_RESULT: ${{ needs.repo-checks.result }}
      WEBSITE_RESULT: ${{ needs.website.result }}
      NATIVE_RESULT: ${{ needs.native.result }}
      EXPECTED_REPO_CHECKS: ${{ (needs.scope.outputs.docs == 'true' || needs.scope.outputs.checks == 'true' || needs.scope.outputs.release_scripts == 'true') && 'success' || 'skipped' }}
      EXPECTED_WEBSITE: ${{ needs.scope.outputs.website == 'true' && github.event_name != 'push' && 'success' || 'skipped' }}
      EXPECTED_NATIVE: ${{ needs.scope.outputs.native == 'true' && 'success' || 'skipped' }}
    steps:
      - name: Require selected checks to pass
        run: |
          require_result() {
            printf '%s: %s (expected %s)\n' "$1" "$2" "$3"
            [[ "$2" == "$3" ]]
          }
          require_result 'Change scope' "$SCOPE_RESULT" success
          require_result 'Repository checks' "$REPO_CHECKS_RESULT" "$EXPECTED_REPO_CHECKS"
          require_result 'Website' "$WEBSITE_RESULT" "$EXPECTED_WEBSITE"
          require_result 'Native matrix' "$NATIVE_RESULT" "$EXPECTED_NATIVE"
