name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '**/*.md'
      - '**/*.i18n.yaml'
      - 'apps/gallery/**'
      - 'apps/gallery-web/**'
      - 'crates/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/website.yml'
      - '.github/workflows/website-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Website
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/website-build.yml
    with:
      publish: true
    permissions:
      contents: read
      pages: read

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
