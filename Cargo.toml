[workspace]
members = ["apps/gallery", "apps/gallery-web", "crates/components", "crates/extras", "crates/foundation", "crates/material", "crates/theme", "xtask"]
default-members = ["crates/theme", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
license-file = "LICENSE"
repository = "https://github.com/wangdiandao/gpui-material"
readme = "README.md"
publish = false

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-base = "=0.10.0"
gpui-material-components = { version = "=0.1.1", path = "crates/components" }
gpui-material-extras = { version = "=0.1.1", path = "crates/extras" }
gpui-material-foundation = { version = "=0.1.1", path = "crates/foundation" }
gpui-material-theme = { version = "=0.1.1", path = "crates/theme" }
web-time = "=1.1.0"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }

[profile.dev]
debug = 0

# Optimize rendering and layout dependencies while keeping workspace code in the normal dev profile.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
resvg = { opt-level = 3 }
ropey = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
smol = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
