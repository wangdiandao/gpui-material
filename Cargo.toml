[workspace]
members = ["apps/gallery", "crates/components", "crates/foundation", "crates/theme", "xtask"]
default-members = ["crates/theme", "xtask"]
exclude = ["experiments/p1-host", "experiments/p1-theme", "experiments/p1-shapes"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-base = "=0.9.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }

[profile.dev]
debug = 0

# GPUI's Windows backend embeds its DirectX shaders with debug assertions off.
[profile.gallery-artifact]
inherits = "dev"
debug-assertions = false
