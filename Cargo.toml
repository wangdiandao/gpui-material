[workspace]
members = ["apps/gallery", "apps/gallery-web", "crates/components", "crates/design-symbols", "crates/extras", "crates/foundation", "crates/material", "crates/theme", "xtask"]
default-members = ["crates/theme", "xtask"]
resolver = "3"

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
license-file = "LICENSE"
repository = "https://github.com/wangdiandao/gpui-material"
readme = "README.md"
publish = false

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui-base = "=0.11.0"
gpui-material-components = { version = "=0.3.3", path = "crates/components", default-features = false }
gpui-material-extras = { version = "=0.3.3", path = "crates/extras" }
gpui-material-foundation = { version = "=0.3.3", path = "crates/foundation" }
gpui-material-theme = { version = "=0.3.3", path = "crates/theme" }
jiff = { version = "1.0", default-features = false }
js-sys = "0.3.107"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
web-time = "1.1.0"
windows = "0.62.2"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }

[profile.dev]
debug = 0

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Optimize rendering and layout dependencies while keeping workspace code in the normal dev profile.
[profile.dev.package]
gpui-base = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-linux = { opt-level = 3 }
gpui-pre-macos = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
gpui-pre-wgpu = { opt-level = 3 }
gpui-pre-windows = { opt-level = 3 }
harfrust = { opt-level = 3 }
image = { opt-level = 3 }
kurbo = { opt-level = 3 }
lyon_geom = { opt-level = 3 }
lyon_path = { opt-level = 3 }
material-color-utils = { opt-level = 3 }
read-fonts = { opt-level = 3 }
resvg = { opt-level = 3 }
ropey = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
skrifa = { opt-level = 3 }
smol = { opt-level = 3 }
taffy = { opt-level = 3 }
tiny-skia = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
usvg = { opt-level = 3 }
zune-inflate = { opt-level = 3 }
