[package]
name = "gpui-material-gallery-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
gpui.workspace = true
gpui-base.workspace = true
gpui-material = { path = "../../crates/material" }
gpui-material-gallery = { path = "../gallery", default-features = false }
gpui_web = { package = "gpui-pre-web", version = "=0.3.12", default-features = false }
js-sys = "0.3"
wasm-bindgen = "=0.2.130"
