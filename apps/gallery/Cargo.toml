[package]
name = "gpui-material-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gpui_material_story"

[[bin]]
name = "gpui-material-gallery"
path = "src/main.rs"
required-features = ["desktop"]
test = false

[features]
default = ["desktop"]
desktop = ["dep:gpui_platform", "gpui-material/window-chrome"]
frame-profile = ["desktop", "gpui/profiler"]
test-support = [
    "gpui/test-support",
    "gpui-base/test-support",
    "gpui_platform?/test-support",
    "gpui-material/test-support",
]

[dependencies]
gpui.workspace = true
gpui-base.workspace = true
gpui_platform = { workspace = true, optional = true }
gpui-material = { path = "../../crates/material", features = ["carousel", "date-time", "dynamic-color", "expressive-groups", "rich-text", "search", "specialized-inputs", "toolbars"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[[test]]
name = "rendering"
# Requires DirectX (Windows), Metal (macOS), or WGPU (Linux); select explicitly with --test rendering.
test = false
harness = false
required-features = ["desktop", "test-support"]
