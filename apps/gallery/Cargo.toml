[package]
name = "gpui-material-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gpui_material_story"

[[bin]]
name = "gpui-material-gallery"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:gpui_platform"]
test-support = ["gpui/test-support", "gpui-base/test-support", "gpui_platform?/test-support"]

[dependencies]
gpui.workspace = true
gpui-base.workspace = true
gpui_platform = { workspace = true, optional = true }
gpui-material = { path = "../../crates/material", features = ["carousel", "date-time", "expressive-groups", "search", "toolbars"] }
