[package]
name = "gpui-material-components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Material 3 Expressive desktop components for GPUI"
publish = ["crates-io"]

[features]
default = ["full"]
actions = []
selection = []
inputs = []
surfaces = ["actions"]
feedback = ["actions"]
navigation = ["actions", "feedback"]
full = ["actions", "selection", "inputs", "surfaces", "feedback", "navigation"]

[dependencies]
gpui.workspace = true
gpui-base.workspace = true
gpui-material-foundation.workspace = true
gpui-material-theme.workspace = true
web-time.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
