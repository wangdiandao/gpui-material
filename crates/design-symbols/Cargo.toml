[package]
name = "gpui-material-design-symbols"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Complete Material Symbols catalog and variable icon outlines for GPUI applications"
publish = ["crates-io"]

[features]
default = []
embed-assets = ["embed-outlined", "embed-rounded", "embed-sharp"]
embed-outlined = []
embed-rounded = []
embed-sharp = []

[dependencies]
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "variable-fonts"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { version = "0.3.107", features = ["Response", "Window"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
