[package]
name = "gpui-material-extras"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Optional Material 3 Expressive component families for GPUI"
publish = ["crates-io"]

[features]
default = []
test-support = [
    "gpui?/test-support",
    "gpui-base?/test-support",
    "gpui-material-foundation?/test-support",
    "gpui-material-components?/test-support",
]
carousel = ["dep:gpui", "dep:gpui-base", "dep:gpui-material-foundation", "dep:gpui-material-theme"]
command-palette = [
    "dep:gpui",
    "dep:gpui-base",
    "dep:gpui-material-components",
    "gpui-material-components/actions",
    "gpui-material-components/inputs",
    "gpui-material-components/surfaces",
    "gpui-material-components/feedback",
    "dep:gpui-material-foundation",
    "dep:gpui-material-theme",
]
data-views = [
    "dep:gpui",
    "dep:gpui-base",
    "dep:gpui-material-components",
    "dep:gpui-material-foundation",
    "dep:gpui-material-theme",
]
disclosure = [
    "dep:gpui",
    "dep:gpui-base",
    "dep:gpui-material-components",
    "gpui-material-components/actions",
    "dep:gpui-material-foundation",
    "dep:gpui-material-theme",
]
expressive-groups = [
    "dep:gpui",
    "dep:gpui-material-components",
    "gpui-material-components/actions",
    "gpui-material-components/feedback",
    "dep:gpui-material-foundation",
    "dep:gpui-material-theme",
]
search = [
    "dep:gpui",
    "dep:gpui-base",
    "dep:gpui-material-components",
    "gpui-material-components/actions",
    "gpui-material-components/inputs",
    "gpui-material-components/surfaces",
    "gpui-material-components/feedback",
    "dep:gpui-material-foundation",
    "dep:gpui-material-theme",
]
toolbars = [
    "dep:gpui",
    "dep:gpui-base",
    "dep:gpui-material-components",
    "gpui-material-components/actions",
    "gpui-material-components/feedback",
    "dep:gpui-material-foundation",
    "dep:gpui-material-theme",
]
date-time = [
    "dep:jiff",
    "dep:gpui",
    "dep:gpui-base",
    "dep:gpui-material-components",
    "gpui-material-components/actions",
    "gpui-material-components/inputs",
    "gpui-material-components/feedback",
    "dep:gpui-material-foundation",
    "dep:gpui-material-theme",
]
window-chrome = ["dep:gpui", "dep:gpui-base", "dep:gpui-material-foundation", "dep:gpui-material-theme", "dep:raw-window-handle", "dep:windows"]

[dependencies]
jiff = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
gpui-base = { workspace = true, optional = true }
gpui-material-components = { workspace = true, optional = true, default-features = false }
gpui-material-foundation = { workspace = true, optional = true }
gpui-material-theme = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
raw-window-handle = { workspace = true, optional = true }
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"], optional = true }

[package.metadata.docs.rs]
features = [
    "carousel",
    "command-palette",
    "data-views",
    "date-time",
    "disclosure",
    "expressive-groups",
    "search",
    "toolbars",
    "window-chrome",
]
rustdoc-args = ["--cfg", "docsrs"]
