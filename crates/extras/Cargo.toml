[package]
name = "gpui-material-extras"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Optional Material 3 Expressive component families for GPUI"
publish = ["crates-io"]

[features]
default = []
test-support = ["gpui?/test-support"]
carousel = ["dep:gpui", "dep:gpui-base", "dep:gpui-material-foundation", "dep:gpui-material-theme"]
expressive-groups = ["dep:gpui", "dep:gpui-material-components", "dep:gpui-material-foundation", "dep:gpui-material-theme"]
search = ["dep:gpui", "dep:gpui-base", "dep:gpui-material-components", "dep:gpui-material-foundation", "dep:gpui-material-theme", "dep:web-time"]
toolbars = ["dep:gpui", "dep:gpui-base", "dep:gpui-material-components", "dep:gpui-material-foundation", "dep:gpui-material-theme"]
date-time = ["dep:chrono", "dep:gpui", "dep:gpui-base", "dep:gpui-material-components", "dep:gpui-material-foundation", "dep:gpui-material-theme"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, optional = true }
gpui = { workspace = true, optional = true }
gpui-base = { workspace = true, optional = true }
gpui-material-components = { workspace = true, optional = true }
gpui-material-foundation = { workspace = true, optional = true }
gpui-material-theme = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }
