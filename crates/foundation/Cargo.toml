[package]
name = "gpui-material-foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "GPUI adapters and drawing primitives for GPUI Material"
publish = ["crates-io"]

[dependencies]
gpui.workspace = true
gpui-base.workspace = true
gpui-material-theme.workspace = true
polymorpher = { version = "=0.1.4", default-features = false }
web-time.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
