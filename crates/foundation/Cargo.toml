[package]
name = "gpui-material-foundation"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui-base.workspace = true
gpui-material-theme = { path = "../theme" }
polymorpher = { version = "=0.1.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
