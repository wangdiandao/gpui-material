[package]
name = "gpui-material"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
readme.workspace = true
description = "Material 3 Expressive components and themes for GPUI desktop applications"
publish = ["crates-io"]

[features]
default = ["full"]
actions = ["gpui-material-components/actions"]
selection = ["gpui-material-components/selection"]
inputs = ["gpui-material-components/inputs"]
surfaces = ["gpui-material-components/surfaces"]
settings-tiles = ["gpui-material-components/settings-tiles"]
feedback = ["gpui-material-components/feedback"]
navigation = ["gpui-material-components/navigation"]
full = ["gpui-material-components/full"]
carousel = ["gpui-material-extras/carousel"]
dynamic-color = ["gpui-material-theme/dynamic-color"]
serde = ["gpui-material-theme/serde"]
expressive-groups = ["gpui-material-extras/expressive-groups"]
search = ["gpui-material-extras/search"]
toolbars = ["gpui-material-extras/toolbars"]
date-time = ["gpui-material-extras/date-time"]
window-chrome = ["gpui-material-extras/window-chrome"]

[dependencies]
gpui-material-components = { workspace = true, default-features = false }
gpui-material-extras = { workspace = true, optional = true }
gpui-material-foundation.workspace = true
gpui-material-theme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
