[package]
name = "gpui-material"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
readme.workspace = true
description = "Material 3 Expressive components and themes for GPUI desktop applications"
publish = ["crates-io"]

[features]
default = ["full"]
display = ["dep:gpui-material-components"]
actions = ["display", "gpui-material-components/actions"]
selection = ["display", "gpui-material-components/selection"]
inputs = ["display", "gpui-material-components/inputs"]
surfaces = ["display", "gpui-material-components/surfaces"]
settings-tiles = ["display", "gpui-material-components/settings-tiles"]
feedback = ["display", "gpui-material-components/feedback"]
navigation = ["display", "gpui-material-components/navigation"]
full = ["display", "gpui-material-components/full"]
carousel = ["dep:gpui-material-extras", "gpui-material-extras/carousel"]
dynamic-color = ["gpui-material-theme/dynamic-color"]
serde = ["gpui-material-theme/serde"]
expressive-groups = ["display", "dep:gpui-material-extras", "gpui-material-extras/expressive-groups"]
search = ["display", "dep:gpui-material-extras", "gpui-material-extras/search"]
toolbars = ["display", "dep:gpui-material-extras", "gpui-material-extras/toolbars"]
date-time = ["display", "dep:gpui-material-extras", "gpui-material-extras/date-time"]
window-chrome = ["dep:gpui-material-extras", "gpui-material-extras/window-chrome"]
test-support = [
    "gpui/test-support",
    "gpui-material-foundation/test-support",
    "gpui-material-components?/test-support",
    "gpui-material-extras?/test-support",
]

[dependencies]
gpui.workspace = true
gpui-material-components = { workspace = true, default-features = false, optional = true }
gpui-material-extras = { workspace = true, optional = true }
gpui-material-foundation.workspace = true
gpui-material-theme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "integration"
required-features = ["test-support"]
