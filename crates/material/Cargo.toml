[package]
name = "gpui-material"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
carousel = ["gpui-material-extras/carousel"]
dynamic-color = ["gpui-material-theme/dynamic-color"]
serde = ["gpui-material-theme/serde"]
expressive-groups = ["gpui-material-extras/expressive-groups"]
search = ["gpui-material-extras/search"]
toolbars = ["gpui-material-extras/toolbars"]
date-time = ["gpui-material-extras/date-time"]

[dependencies]
gpui-material-components = { path = "../components" }
gpui-material-extras = { path = "../extras", optional = true }
gpui-material-foundation = { path = "../foundation" }
gpui-material-theme = { path = "../theme" }
