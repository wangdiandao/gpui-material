[package]
name = "gpui-material"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
readme.workspace = true
description = "Material 3 Expressive components and themes for GPUI desktop applications"
publish = ["crates-io"]

[features]
default = []
carousel = ["gpui-material-extras/carousel"]
dynamic-color = ["gpui-material-theme/dynamic-color"]
serde = ["gpui-material-theme/serde"]
expressive-groups = ["gpui-material-extras/expressive-groups"]
search = ["gpui-material-extras/search"]
toolbars = ["gpui-material-extras/toolbars"]
date-time = ["gpui-material-extras/date-time"]

[dependencies]
gpui-material-components.workspace = true
gpui-material-extras = { workspace = true, optional = true }
gpui-material-foundation.workspace = true
gpui-material-theme.workspace = true
