[package]
name = "gpui-material-symbols"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Complete Material Symbols catalog and variable icon outlines for GPUI applications"
publish = ["crates-io"]

[features]
default = []
embed-assets = []

[dependencies]
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "variable-fonts"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["Response", "Window"] }
