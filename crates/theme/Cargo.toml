[package]
name = "gpui-material-theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Material 3 Expressive tokens and themes for GPUI Material"
publish = ["crates-io"]

[features]
default = []
dynamic-color = ["dep:material-color-utils"]
serde = ["dep:serde"]

[dependencies]
material-color-utils = { version = "0.1.3", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0.154"
