[package]
name = "gpui-material-theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Material 3 Expressive tokens and themes for GPUI Material"
publish = ["crates-io"]

[features]
default = []
dynamic-color = ["dep:material-color-utils"]
serde = ["dep:serde"]

[dependencies]
material-color-utils = { version = "0.1.3", default-features = false, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
